# ===================================================================
# 1. EXPERIMENT CONTROL
# Define the overall run and saving behavior.
# To pass no value please use 'null'. 'None' is registered as string.
# ===================================================================

experiment:
  # A unique name for this run (used for output directory creation). 
  # If left empty a name is automatically generated.
  run_name: null
  # Set to True to train a new model; False to load a pre-trained one.
  train_model: false
  # If train_model is False, specify the experiment path to load weights from.
  base_experiment_to_load: "/workspace/experiments/2025-09-26_11-05_NewVAE_multi_XCov_hybrid_random_xcov"
  # Base directory where all results (logs, models, metrics) will be saved
  output_root_dir: "/workspace/experiments"


# ===================================================================
# 2. DATA SPECIFICATION
# Define the location and format of the input data.
# ===================================================================

data:
  # Path to the main data directory. Per atlas one file with ALL samples!
  data_dir: "/workspace/data/"
  # Format of the raw input data. Options: h5, csv
  # Every data file must have ROI^measurementtype as row indices, and samples as column names.
  data_format: "csv"
  # Path to the supplementary metadata file. This should contain ALL samples.
  metadata_path: "/workspace/data/full_metadata.csv"
  # List of atlases. Ensure that the data of each atlas segmentation is saved to a separate file.
  # The system will automatically determine the best abbreviation.
  input_atlases:
    - neuromorphometrics
    - suit
    - lpba40
    - cobra
  # Which diagnoses are present in your data? Specify the colors.
  diagnoses: ["HC", "MDD", "SCHZ", "CTT"]
  diagnosis_colors: ["darkorange", "blue", "red", "navy"]

  # Should a batch correction of the data be performed using PyCombat?
  batch_correction: null

  # --- Resampling of data  --- 
  # What resampling method should be used on the data? Choice between "hybrid", "over", "under" and None
  resampling: "hybrid"
  # If resampling is either "over" or "under" please specify the specific method
  # Undersampling provides: "allknn", "nm2", "random" and "tomek"
  # Oversampling provides: "ADASYN", "SMOTE", "SMOTENC" and "random"
  resampling_method: ""
  # If resampling is "hybrid", please specify [minority_label, target, majority_label]
  hybrid_ranking: ["MDD", "SCHZ", "HC"]

  # Type of measurement to use for training. "None" defaults to all. ("Vgm", "Vwm", "Vcsf")
  mtype: None
  # Split into data for model training and model validation 
  train_proportion: 0.7

  # --- Train-test split --- 
  train_test_split: 
    # Remove a subset of the data before spliting into training / testing. Leave list empty for None.
    # remove_within_variable and remove_variable_values must have the same length! 
    remove_within_variable: ["Dataset"]
    remove_variable_values: [["whiteCAT", "NSS"]]
    # If a subset is removed, should this subset also be used for testing? Set None for single testing. 
    # "all" to use entire removed subset or specify a value from remove_within_variable or remove_variable_values.
    test_on_subset: "all"

    # Split into data for training / validation and testing by taking proportions of entire data
    train_valid_proportion: 0.8


# ===================================================================
# 3. EVALUATION
# Define which steps of the testing and downstream analysis are performed.
# ===================================================================

analysis: 
  # Which testing should be performed
  test_1: 
    # Should downstream analysis be performed
    downstream: false
    # Is there additional metadata associated with this testing data? 
    # Regardless of train_test_split, pass this as a single df with rosw=samples, columns=vars
    # Ensure a "Diagnosis_extra" column, where each diagnosis is mapped to one of the training outputs!
    extra_metadata_path: null
    correlation_analysis: false
    SHAP_analysis: false
    latent_feature_analysis: false

  test_2: 
    downstream: true
    extra_metadata_path: "/workspace/data/extended_metadata.csv"
    correlation_analysis: true
    SHAP_analysis: false
    latent_feature_analysis: true

#joint_umap: True
